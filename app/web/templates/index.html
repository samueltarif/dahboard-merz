<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ settings.app_name }} — {{ settings.empresa_label }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f1e1c'/%3E%3Cpath d='M9 22V12m7 10V8m7 14v-6' stroke='%23f7f6f3' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Aplica o tema salvo antes de pintar a página (evita "piscar").
    try { const t = localStorage.getItem('painel-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="eyebrow"><i class="dot"></i><span id="status-line">Base SAP · {{ settings.empresa_label }}</span></span>
        <h1>Painel tributário</h1>
        <p class="sub" id="period-line">Importe o relatório do SAP para começar.</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" data-action="import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3m0 0L7 8m5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          Importar planilhas
        </button>
        <div class="menu">
          <button class="btn" data-action="export-menu" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            Exportar
          </button>
          <div class="menu-pop" id="export-menu" hidden>
            <button class="menu-item" data-export="xlsx"><b>Excel completo (.xlsx)</b><span>Resumo, tributos, UF, CFOP, materiais, reforma, conformidade e base SAP</span></button>
            <button class="menu-item" data-export="csv"><b>Base filtrada (.csv)</b><span>Itens no layout SAP, separador “;” — reimportável</span></button>
          </div>
        </div>
        <button class="btn btn-icon" data-action="theme" aria-label="Alternar tema claro/escuro" title="Tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist" id="tabs"></nav>
    <section class="filters" id="filters" aria-label="Filtros" hidden></section>
    <main id="view" aria-live="polite"></main>
  </div>

  <div class="toasts" id="toasts" role="status"></div>
  <script src="/static/vendor/echarts.min.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
